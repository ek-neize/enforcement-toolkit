inputs:
  prices: data/sample/prices.csv
  insider_trades: data/sample/insider_trades.csv
  events: data/sample/events.csv
source: "synthetic sample generated by validation.cli sample (seed 7)"
custody_log: data/custody_log.jsonl
output_dir: reports/data_quality
thresholds:
  extreme_return: 0.50
  zero_volume_run: 3
  stale_price_run: 5
  max_filing_lag_days: 5
  price_range_tolerance: 0.01
  event_lookback_days: 30
  event_lookahead_days: 5
